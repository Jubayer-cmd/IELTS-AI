# Docker Compose - IELTS Writing AI
# Based on FastAPI Full-Stack Template

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ielts-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ielts-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: ielts-db
    environment:
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts_password
      POSTGRES_DB: ielts_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
