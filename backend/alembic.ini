# Alembic Configuration File

[alembic]
# Path to migration scripts
script_location = app/alembic

# Template for new migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend sys.path with app directory for imports
prepend_sys_path = .

# Timezone for migration timestamps
# timezone =

# Truncate revision hash in filenames
truncate_slug_length = 40

# Set to 'true' to run online migrations
revision_environment = false

# Set to 'true' for use with Alembic's require_source_for_rev directive
sourceless = false

# Version path separator
version_path_separator = os  # default: os

# Output encoding
output_encoding = utf-8

# Database URL - loaded from environment in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Post-write hooks for formatting
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
